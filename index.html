<style>
  :root {
    --color-bg: #061B40;
    --color-text: #FCF5ED;
    --color-muted: #A8B4C8;
    --color-accent: #38B6B2;
    --color-divider: #1E4272;
    --font: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter: clamp(20px, 5vw, 72px);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font);
    text-wrap: pretty;
    -webkit-font-smoothing: antialiased;
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px max(var(--gutter), calc((100% - 1200px) / 2 + var(--gutter)));
    border-bottom: 2px solid var(--color-divider);
  }

  .nav__logo {
    width: 164px;
    height: 40px;
    display: block;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 var(--gutter);
  }

  .hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: calc(100vh - 300px);
    padding: clamp(84px, 12vh, 168px) 0 84px;
  }

  .hero__mark {
    width: 64px;
    height: 64px;
    display: block;
    margin-bottom: 42px;
  }

  .hero__title {
    font-weight: 700;
    font-size: clamp(46px, 6.8vw, 92px);
    line-height: 1.06;
    letter-spacing: -0.02em;
    margin: 0 0 0 -0.03em;
  }

  .hero__title span { display: block; }

  .hero__lede {
    font-size: 17px;
    line-height: 28px;
    max-width: 56ch;
    margin: 42px 0 0;
    color: var(--color-muted);
  }

  .hero__cta {
    display: inline-flex;
    align-items: baseline;
    gap: 12px;
    width: fit-content;
    margin-top: 56px;
    font-weight: 700;
    font-size: clamp(20px, 2.2vw, 28px);
    letter-spacing: -0.01em;
    color: var(--color-accent);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 6px;
    transition: color 0.15s ease;
  }

  .hero__cta:hover { color: var(--color-text); }

  .hero__cta:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .rule {
    height: 2px;
    border: 0;
    margin: 0;
    background: var(--color-divider);
  }

  .footer {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 28px;
    padding: 56px 0;
    font-size: 13px;
    line-height: 28px;
    color: var(--color-muted);
  }

  .footer__note {
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<nav class="nav">
  <img class="nav__logo" src="assets/logo-horizontal.png" alt="EMPIRES Dev" width="164" height="40">
</nav>

<div class="container">
  <main class="hero">
    <svg class="hero__mark" viewBox="14 14.5 72 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <rect x="14" y="63" width="72" height="20" rx="5" fill="#38B6B2"/>
      <rect x="27.5" y="40" width="45" height="20" rx="5" fill="#38B6B2"/>
      <rect x="40.5" y="18" width="19" height="19" rx="4" fill="#FCF5ED"/>
    </svg>

    <h1 class="hero__title">
      <span>Every empire starts</span>
      <span>with good code.</span>
    </h1>

    <p class="hero__lede">Custom web and mobile apps, and the consulting that gets them shipped.</p>

    <a class="hero__cta" href="mailto:hello@empiresdev.com">hello@empiresdev.com<span aria-hidden="true">&rarr;</span></a>
  </main>

  <hr class="rule">

  <footer class="footer">
    <span>&copy; 2026 EMPIRES Dev</span>
    <!-- Descomente a linha abaixo para exibir o aviso de portfólio no rodapé. -->
    <!-- <span class="footer__note">Portfolio — coming soon</span> -->
  </footer>
</div>

</body>
</html>
