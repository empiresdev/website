<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<template id="__bundler_thumbnail" data-bg-color="#061B40">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="800" fill="#061B40"/>
<rect x="540" y="280" width="120" height="110" rx="26" fill="#FCF5ED"/>
<rect x="480" y="410" width="240" height="100" rx="26" fill="#38B6B2"/>
<rect x="420" y="530" width="360" height="100" rx="26" fill="#38B6B2"/>
</svg>
</template>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-ac4f7e09-c7aa-49e3-bf62-aff034561bde/styles.css">
  <script src="_ds/modernist-ac4f7e09-c7aa-49e3-bf62-aff034561bde/_ds_bundle.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --color-bg: #061B40; --color-text: #FCF5ED; --color-accent: #38B6B2; --color-accent-400: #6CCAC6; --color-accent-600: #2C9995; --color-accent-700: #1E7C79; --color-divider: #1E4272; --font-heading: 'Space Grotesk', sans-serif; --font-body: 'Space Grotesk', sans-serif; --font-heading-weight: 700; }
    body { margin: 0; text-wrap: pretty; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
    a { color: var(--color-text); }
    a:hover { color: var(--color-accent); }
  </style>
</helmet>

<nav class="nav" style="padding-inline: max(clamp(20px, 5vw, 72px), calc((100% - 1200px) / 2 + clamp(20px, 5vw, 72px)))">
  <img src="uploads/Empires Dev Logo Directions/png/empiresdev-horizontal-dark.png" alt="EMPIRES Dev" style="width: 164px; height: 40px; display: block">
</nav>

<div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 72px)">
  <section style="display: flex; flex-direction: column; justify-content: center; min-height: calc(100vh - 300px); padding: clamp(84px, 12vh, 168px) 0 84px">
    <img src="uploads/Empires Dev Logo Directions/png/empiresdev-simbolo-dark.png" alt="" style="width: 64px; height: 64px; display: block; margin-bottom: 42px">
    <h1 style="font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(46px, 6.8vw, 92px); line-height: 1.06; letter-spacing: -0.02em; margin: 0 0 0 -0.03em">
      <span style="display: block">Every empire starts</span>
      <span style="display: block">with good code.</span>
    </h1>
    <p style="font-size: 17px; line-height: 28px; max-width: 56ch; margin: 42px 0 0; color: #A8B4C8">Custom web and mobile apps, and the consulting that gets them shipped.</p>
    <a href="mailto:hello@empiresdev.com" style="display: inline-flex; align-items: baseline; gap: 12px; width: fit-content; margin-top: 56px; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(20px, 2.2vw, 28px); letter-spacing: -0.01em; color: var(--color-accent); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px" style-hover="color: #FCF5ED" style-focus="outline: 2px solid var(--color-accent); outline-offset: 2px">hello@empiresdev.com<span aria-hidden="true">→</span></a>
  </section>
  <hr style="height: 2px; border: 0; margin: 0; background: var(--color-divider)">
  <footer style="display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 56px 0; font-size: 13px; line-height: 28px; color: #A8B4C8">
    <span>© 2026 EMPIRES Dev</span>
    <sc-if value="{{ showComingSoon }}" hint-placeholder-val="{{ true }}">
      <span style="letter-spacing: 0.08em; text-transform: uppercase">Portfolio — coming soon</span>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showComingSoon&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Footer&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { showComingSoon: this.props.showComingSoon ?? true };
  }
}
</script>
</body>
</html>
